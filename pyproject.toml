[project]
name = "tiny-siam-cnn"
version = "0.1.0"
description = "Train a tiny Siamese CNN and track ten points on a synthetic moving object"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1,<3",
    "onnx>=1.18,<2",
    "onnxruntime-gpu>=1.21,<2",
    "onnxscript>=0.3,<1",
    "opencv-python-headless>=4.10,<5",
    "torch>=2.7,<3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
